# Install only after the DNS record exists and the certificate has been issued:
#   certbot certonly --nginx -d fime-api.zanua.co.tz
#   cp nginx-fime-assistant.conf /etc/nginx/sites-available/fime-assistant
#   ln -s ../sites-available/fime-assistant /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name fime-api.zanua.co.tz;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fime-api.zanua.co.tz;

    ssl_certificate     /etc/letsencrypt/live/fime-api.zanua.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fime-api.zanua.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 200k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # the app trusts this only because nginx sets it
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
